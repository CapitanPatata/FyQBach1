<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenador Extensivo Máximo: Oxisales y Oxoaniones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between select-none">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-extrabold text-teal-400">Entrenador Extensivo Máximo</h1>
                <p class="text-xs text-slate-400">Base de datos masiva de Oxisales y Oxoaniones</p>
            </div>
            <div class="flex items-center space-x-6">
                <div class="text-right">
                    <span class="text-xs text-slate-400 block uppercase tracking-wider">Racha</span>
                    <span id="streakDisplay" class="text-xl font-black text-amber-400">🔥 0</span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block uppercase tracking-wider">Aciertos</span>
                    <span id="scoreDisplay" class="text-xl font-black text-teal-400">0 / 0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-4 my-auto">
        
        <!-- Pantalla de Menú Principal Modificada -->
        <div id="menuScreen" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl text-center space-y-6">
            <h2 class="text-2xl font-bold text-teal-400">Menú Principal</h2>
            <p class="text-sm text-slate-400">Selecciona el modo de práctica deseado:</p>
            <div class="space-y-4 pt-2">
                <button onclick="startPractice(1)" class="w-full py-4 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-base text-white shadow-lg transition active:scale-[0.98]">
                    Modo: Escribir Nombres
                </button>
                <button onclick="startPractice(2)" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-base text-white shadow-lg transition active:scale-[0.98]">
                    Modo: Seleccionar Fórmula
                </button>
            </div>
        </div>

        <!-- Contenedor del Quiz (Oculto inicialmente) -->
        <div id="quizScreen" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl relative hidden">
            
            <div class="flex justify-between items-center mb-6">
                <span id="modeBadge" class="text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider bg-teal-950 text-teal-300 border border-teal-700">
                    Modo
                </span>
                <div class="flex items-center space-x-2">
                    <span id="elemBadge" class="text-xs font-semibold bg-slate-700 text-slate-300 px-3 py-1 rounded-md">
                        Categoría
                    </span>
                    <button onclick="returnToMenu()" class="text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1 rounded-md transition">
                        Menú
                    </button>
                </div>
            </div>

            <div class="text-center py-4 my-2">
                <p class="text-xs text-slate-400 uppercase tracking-widest mb-3 font-semibold" id="questionLabel"></p>
                <div id="questionTarget" class="text-3xl font-bold text-amber-300 min-h-[4rem] flex items-center justify-center">
                </div>
            </div>

            <div id="formMode1" class="space-y-4 my-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nomenclatura Tradicional / Stock:</label>
                    <input type="text" id="inputTrad" placeholder="Ej: sulfato de hierro(iii) / hipoyodito de sodio" autocomplete="off" spellcheck="false"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-teal-400 text-slate-100 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nomenclatura IUPAC / Sistema:</label>
                    <input type="text" id="inputIupac" placeholder="Ej: tetraoxidosulfato de hierro(III)" autocomplete="off" spellcheck="false"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-teal-400 text-slate-100 transition">
                </div>
                <button onclick="checkMode1()" class="w-full py-3 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-sm text-white shadow-lg transition active:scale-[0.98]">
                    Comprobar Respuesta
                </button>
            </div>

            <div id="formMode2" class="grid grid-cols-2 gap-3 my-6 hidden">
            </div>

            <div id="feedbackBox" class="hidden rounded-xl p-4 text-sm space-y-2 mt-4">
            </div>

            <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full py-3 mt-4 bg-amber-500 hover:bg-amber-400 rounded-lg font-bold text-sm text-slate-950 shadow-lg transition active:scale-[0.98]">
                Siguiente Pregunta ➔
            </button>

        </div>

    </main>

    <footer class="text-center py-4 text-xs text-slate-500">
        Entrenador Extensivo Máximo • Base de datos de Oxisales y Oxoaniones[cite: 1]
    </footer>

    <script>
        const db = [
            // ================= OXOANIONES =================[cite: 1]
            { formula: "\\mathrm{IO}^-", category: "Oxoanión", trad: ["hipoyodito"], iupac: ["oxidoyodato(1-)", "monoxidoyodato(1-)"], options: ["\\mathrm{IO}^-", "\\mathrm{IO}_2^-", "\\mathrm{IO}_3^-", "\\mathrm{IO}_4^-"] },
            { formula: "\\mathrm{IO}_2^-", category: "Oxoanión", trad: ["yodito"], iupac: ["dioxidoyodato(1-)"], options: ["\\mathrm{IO}^-", "\\mathrm{IO}_2^-", "\\mathrm{IO}_3^-", "\\mathrm{IO}_4^-"] },
            { formula: "\\mathrm{IO}_3^-", category: "Oxoanión", trad: ["yodato"], iupac: ["trioxidoyodato(1-)"], options: ["\\mathrm{IO}^-", "\\mathrm{IO}_2^-", "\\mathrm{IO}_3^-", "\\mathrm{IO}_4^-"] },
            { formula: "\\mathrm{IO}_4^-", category: "Oxoanión", trad: ["periodato"], iupac: ["tetraoxidoyodato(1-)"], options: ["\\mathrm{IO}^-", "\\mathrm{IO}_2^-", "\\mathrm{IO}_3^-", "\\mathrm{IO}_4^-"] },
            { formula: "\\mathrm{ClO}^-", category: "Oxoanión", trad: ["hipoclorito"], iupac: ["oxidoclorato(1-)", "monoxidoclorato(1-)"], options: ["\\mathrm{ClO}^-", "\\mathrm{ClO}_2^-", "\\mathrm{ClO}_3^-", "\\mathrm{ClO}_4^-"] },
            { formula: "\\mathrm{ClO}_2^-", category: "Oxoanión", trad: ["clorito"], iupac: ["dioxidoclorato(1-)"], options: ["\\mathrm{ClO}^-", "\\mathrm{ClO}_2^-", "\\mathrm{ClO}_3^-", "\\mathrm{ClO}_4^-"] },
            { formula: "\\mathrm{ClO}_3^-", category: "Oxoanión", trad: ["clorato"], iupac: ["trioxidoclorato(1-)"], options: ["\\mathrm{ClO}^-", "\\mathrm{ClO}_2^-", "\\mathrm{ClO}_3^-", "\\mathrm{ClO}_4^-"] },
            { formula: "\\mathrm{ClO}_4^-", category: "Oxoanión", trad: ["perclorato"], iupac: ["tetraoxidoclorato(1-)"], options: ["\\mathrm{ClO}^-", "\\mathrm{ClO}_2^-", "\\mathrm{ClO}_3^-", "\\mathrm{ClO}_4^-"] },
            { formula: "\\mathrm{BrO}^-", category: "Oxoanión", trad: ["hipobromito"], iupac: ["oxidobromato(1-)"], options: ["\\mathrm{BrO}^-", "\\mathrm{BrO}_2^-", "\\mathrm{BrO}_3^-", "\\mathrm{BrO}_4^-"] },
            { formula: "\\mathrm{BrO}_2^-", category: "Oxoanión", trad: ["bromito"], iupac: ["dioxidobromato(1-)"], options: ["\\mathrm{BrO}^-", "\\mathrm{BrO}_2^-", "\\mathrm{BrO}_3^-", "\\mathrm{BrO}_4^-"] },
            { formula: "\\mathrm{BrO}_3^-", category: "Oxoanión", trad: ["bromato"], iupac: ["trioxidobromato(1-)"], options: ["\\mathrm{BrO}^-", "\\mathrm{BrO}_2^-", "\\mathrm{BrO}_3^-", "\\mathrm{BrO}_4^-"] },
            { formula: "\\mathrm{BrO}_4^-", category: "Oxoanión", trad: ["perbromato"], iupac: ["tetraoxidobromato(1-)"], options: ["\\mathrm{BrO}^-", "\\mathrm{BrO}_2^-", "\\mathrm{BrO}_3^-", "\\mathrm{BrO}_4^-"] },
            { formula: "\\mathrm{SO}_3^{2-}", category: "Oxoanión", trad: ["sulfito"], iupac: ["trioxidosulfato(2-)"], options: ["\\mathrm{SO}_3^{2-}", "\\mathrm{SO}_4^{2-}", "\\mathrm{S}_2\\mathrm{O}_3^{2-}", "\\mathrm{HSO}_4^-"] },
            { formula: "\\mathrm{SO}_4^{2-}", category: "Oxoanión", trad: ["sulfato"], iupac: ["tetraoxidosulfato(2-)"], options: ["\\mathrm{SO}_3^{2-}", "\\mathrm{SO}_4^{2-}", "\\mathrm{S}_2\\mathrm{O}_3^{2-}", "\\mathrm{HSO}_4^-"] },
            { formula: "\\mathrm{S}_2\\mathrm{O}_3^{2-}", category: "Oxoanión", trad: ["tiosulfato"], iupac: ["trioxidotiosulfato(2-)", "trioxidodisulfato(2-)"], options: ["\\mathrm{SO}_3^{2-}", "\\mathrm{SO}_4^{2-}", "\\mathrm{S}_2\\mathrm{O}_3^{2-}", "\\mathrm{S}_2\\mathrm{O}_7^{2-}"] },
            { formula: "\\mathrm{S}_2\\mathrm{O}_7^{2-}", category: "Oxoanión", trad: ["disulfato", "pirosulfato"], iupac: ["heptaoxidodisulfato(2-)"], options: ["\\mathrm{SO}_4^{2-}", "\\mathrm{S}_2\\mathrm{O}_3^{2-}", "\\mathrm{S}_2\\mathrm{O}_7^{2-}", "\\mathrm{SO}_3^{2-}"] },

            { formula: "\\mathrm{SeO}_3^{2-}", category: "Oxoanión", trad: ["selenito"], iupac: ["trioxidoseleniato(2-)"], options: ["\\mathrm{SeO}_3^{2-}", "\\mathrm{SeO}_4^{2-}", "\\mathrm{Se}^{2-}", "\\mathrm{HSeO}_3^-"] },
            { formula: "\\mathrm{SeO}_4^{2-}", category: "Oxoanión", trad: ["selenato"], iupac: ["tetraoxidoseleniato(2-)"], options: ["\\mathrm{SeO}_3^{2-}", "\\mathrm{SeO}_4^{2-}", "\\mathrm{Se}^{2-}", "\\mathrm{HSeO}_4^-"] },
            { formula: "\\mathrm{TeO}_3^{2-}", category: "Oxoanión", trad: ["telurito"], iupac: ["trioxidotelurato(2-)"], options: ["\\mathrm{TeO}_3^{2-}", "\\mathrm{TeO}_4^{2-}", "\\mathrm{Te}^{2-}", "\\mathrm{HTeO}_3^-"] },

            // ================= OXISALES NEUTRALES (VALENCIA FIJA) =================[cite: 1]

            { formula: "\\mathrm{CoSO}_4", category: "Oxisal (Co II)", trad: ["sulfato de cobalto(ii)"], iupac: ["tetraoxidosulfato de cobalto(ii)", "sulfato de cobalto(ii)"], options: ["\\mathrm{CoSO}_4", "\\mathrm{Co}_2(\\mathrm{SO}_4)_3", "\\mathrm{CoCO}_3", "\\mathrm{CoO}"] },
            { formula: "\\mathrm{Co}_2(\\mathrm{SO}_4)_3", category: "Oxisal (Co III)", trad: ["sulfato de cobalto(iii)"], iupac: ["tris(tetraoxidosulfato) de dicobalto", "tetraoxidosulfato de cobalto(iii)", "sulfato de cobalto(iii)"], options: ["\\mathrm{CoSO}_4", "\\mathrm{Co}_2(\\mathrm{SO}_4)_3", "\\mathrm{CoCO}_3", "\\mathrm{Co}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{Co(NO}_3)_2", category: "Oxisal (Co II)", trad: ["nitrato de cobalto(ii)"], iupac: ["bis(trioxidonitrato) de cobalto", "trioxidonitrato de cobalto(ii)", "nitrato de cobalto(ii)"], options: ["\\mathrm{Co(NO}_3)_2", "\\mathrm{Co(NO}_3)_3", "\\mathrm{CoSO}_4", "\\mathrm{CoO}"] },
            { formula: "\\mathrm{Co(NO}_3)_3", category: "Oxisal (Co III)", trad: ["nitrato de cobalto(iii)"], iupac: ["tris(trioxidonitrato) de cobalto", "trioxidonitrato de cobalto(iii)", "nitrato de cobalto(iii)"], options: ["\\mathrm{Co(NO}_3)_2", "\\mathrm{Co(NO}_3)_3", "\\mathrm{Co}_2(\\mathrm{SO}_4)_3", "\\mathrm{Co}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{NiSO}_4", category: "Oxisal (Ni II)", trad: ["sulfato de níquel(ii)"], iupac: ["tetraoxidosulfato de niquel(ii)", "sulfato de niquel(ii)"], options: ["\\mathrm{NiSO}_4", "\\mathrm{Ni}_2(\\mathrm{SO}_4)_3", "\\mathrm{NiCO}_3", "\\mathrm{NiO}"] },
            { formula: "\\mathrm{Ni}_2(\\mathrm{SO}_4)_3", category: "Oxisal (Ni III)", trad: ["sulfato de níquel(iii)"], iupac: ["tris(tetraoxidosulfato) de diniquel", "tetraoxidosulfato de niquel(iii)", "sulfato de niquel(iii)"], options: ["\\mathrm{NiSO}_4", "\\mathrm{Ni}_2(\\mathrm{SO}_4)_3", "\\mathrm{Ni}_2(\\mathrm{CO}_3)_3", "\\mathrm{Ni}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{Ni(NO}_3)_2", category: "Oxisal (Ni II)", trad: ["nitrato de níquel(ii)"], iupac: ["bis(trioxidonitrato) de niquel", "trioxidonitrato de niquel(ii)", "nitrato de niquel(ii)"], options: ["\\mathrm{Ni(NO}_3)_2", "\\mathrm{Ni(NO}_3)_3", "\\mathrm{NiSO}_4", "\\mathrm{NiO}"] },
            { formula: "\\mathrm{Hg}_2\\mathrm{SO}_4", category: "Oxisal (Hg I)", trad: ["sulfato de mercurio(i)"], iupac: ["tetraoxidosulfato de dimercurio", "tetraoxidosulfato de mercurio(i)", "sulfato de mercurio(i)"], options: ["\\mathrm{Hg}_2\\mathrm{SO}_4", "\\mathrm{HgSO}_4", "\\mathrm{Hg}_2\\mathrm{NO}_3", "\\mathrm{Hg}_2\\mathrm{Cl}_2"] },
            { formula: "\\mathrm{HgSO}_4", category: "Oxisal (Hg II)", trad: ["sulfato de mercurio(ii)"], iupac: ["tetraoxidosulfato de mercurio(ii)", "sulfato de mercurio(ii)"], options: ["\\mathrm{Hg}_2\\mathrm{SO}_4", "\\mathrm{HgSO}_4", "\\mathrm{Hg(NO}_3)_2", "\\mathrm{HgO}"] },
            { formula: "\\mathrm{Hg}_2\\mathrm{(NO}_3)_2", category: "Oxisal (Hg I)", trad: ["nitrato de mercurio(i)"], iupac: ["bis(trioxidonitrato) de dimercurio", "trioxidonitrato de mercurio(i)", "nitrato de mercurio(i)"], options: ["\\mathrm{Hg}_2\\mathrm{(NO}_3)_2", "\\mathrm{Hg(NO}_3)_2", "\\mathrm{Hg}_2\\mathrm{SO}_4", "\\mathrm{Hg}_2\\mathrm{O}"] },
            { formula: "\\mathrm{Hg(NO}_3)_2", category: "Oxisal (Hg II)", trad: ["nitrato de mercurio(ii)"], iupac: ["bis(trioxidonitrato) de mercurio", "trioxidonitrato de mercurio(ii)", "nitrato de mercurio(ii)"], options: ["\\mathrm{Hg}_2\\mathrm{(NO}_3)_2", "\\mathrm{Hg(NO}_3)_2", "\\mathrm{HgSO}_4", "\\mathrm{HgO}"] },
            { formula: "\\mathrm{AuNO}_3", category: "Oxisal (Au I)", trad: ["nitrato de oro(i)"], iupac: ["trioxidonitrato de oro(i)", "trioxidonitrato de oro(1+)"], options: ["\\mathrm{AuNO}_3", "\\mathrm{Au(NO}_3)_3", "\\mathrm{Au}_2\\mathrm{SO}_4", "\\mathrm{Au}_2\\mathrm{O}"] },
            { formula: "\\mathrm{Au(NO}_3)_3", category: "Oxisal (Au III)", trad: ["nitrato de oro(iii)"], iupac: ["tris(trioxidonitrato) de oro", "trioxidonitrato de oro(iii)", "nitrato de oro(iii)"], options: ["\\mathrm{AuNO}_3", "\\mathrm{Au(NO}_3)_3", "\\mathrm{Au}_2(\\mathrm{SO}_4)_3", "\\mathrm{Au}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{Au}_2(\\mathrm{SO}_4)_3", category: "Oxisal (Au III)", trad: ["sulfato de oro(iii)"], iupac: ["tris(tetraoxidosulfato) de dioro", "tetraoxidosulfato de oro(iii)", "sulfato de oro(iii)"], options: ["\\mathrm{Au}_2\\mathrm{SO}_4", "\\mathrm{Au}_2(\\mathrm{SO}_4)_3", "\\mathrm{Au(NO}_3)_3", "\\mathrm{Au}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{PtSO}_4", category: "Oxisal (Pt II)", trad: ["sulfato de platino(ii)"], iupac: ["tetraoxidosulfato de platino(ii)", "sulfato de platino(ii)"], options: ["\\mathrm{PtSO}_4", "\\mathrm{Pt(SO}_4)_2", "\\mathrm{Pt(NO}_3)_2", "\\mathrm{PtO}"] },
            { formula: "\\mathrm{Pt(SO}_4)_2", category: "Oxisal (Pt IV)", trad: ["sulfato de platino(iv)"], iupac: ["bis(tetraoxidosulfato) de platino", "tetraoxidosulfato de platino(iv)", "sulfato de platino(iv)"], options: ["\\mathrm{PtSO}_4", "\\mathrm{Pt(SO}_4)_2", "\\mathrm{Pt(NO}_3)_4", "\\mathrm{PtO}_2"] },
            { formula: "\\mathrm{Pt(NO}_3)_2", category: "Oxisal (Pt II)", trad: ["nitrato de platino(ii)"], iupac: ["bis(trioxidonitrato) de platino", "trioxidonitrato de platino(ii)", "nitrato de platino(ii)"], options: ["\\mathrm{Pt(NO}_3)_2", "\\mathrm{Pt(NO}_3)_4", "\\mathrm{PtSO}_4", "\\mathrm{PtO}"] },
            { formula: "\\mathrm{Pt(NO}_3)_4", category: "Oxisal (Pt IV)", trad: ["nitrato de platino(iv)"], iupac: ["tetrakis(trioxidonitrato) de platino", "trioxidonitrato de platino(iv)", "nitrato de platino(iv)"], options: ["\\mathrm{Pt(NO}_3)_2", "\\mathrm{Pt(NO}_3)_4", "\\mathrm{Pt(SO}_4)_2", "\\mathrm{PtO}_2"] },
            { formula: "\\mathrm{Bi(NO}_3)_3", category: "Oxisal (Bi III)", trad: ["nitrato de bismuto(iii)"], iupac: ["tris(trioxidonitrato) de bismuto", "trioxidonitrato de bismuto(iii)"], options: ["\\mathrm{Bi(NO}_3)_3", "\\mathrm{Bi}_2(\\mathrm{SO}_4)_3", "\\mathrm{BiPO}_4", "\\mathrm{Bi}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{Bi}_2(\\mathrm{SO}_4)_3", category: "Oxisal (Bi III)", trad: ["sulfato de bismuto(iii)"], iupac: ["tris(tetraoxidosulfato) de dibismuto", "tetraoxidosulfato de bismuto(iii)"], options: ["\\mathrm{Bi(NO}_3)_3", "\\mathrm{Bi}_2(\\mathrm{SO}_4)_3", "\\mathrm{BiPO}_4", "\\mathrm{Bi}_2\\mathrm{O}_3"] },
            { formula: "\\mathrm{BiPO}_4", category: "Oxisal (Bi III)", trad: ["fosfato de bismuto(iii)"], iupac: ["tetraoxidofosfato de bismuto(iii)", "tetraoxidofosfato de bismuto"], options: ["\\mathrm{Bi(NO}_3)_3", "\\mathrm{Bi}_2(\\mathrm{SO}_4)_3", "\\mathrm{BiPO}_4", "\\mathrm{BiPO}_3"] }
        ];

        let currentItem = null;
        let currentMode = 1;
        let score = 0, total = 0, streak = 0;

        function renderMath(targetElement, latexString) {
            targetElement.innerHTML = '';
            try {
                katex.render(latexString, targetElement, { throwOnError: false, displayMode: true });
            } catch (e) {
                targetElement.innerText = latexString;
            }
        }

        function cleanStr(str) {
            return str.trim().toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, "")
                .replace(/\(2\+\)/g, "(ii)")
                .replace(/\(3\+\)/g, "(iii)")
                .replace(/\(1\+\)/g, "(i)")
                .replace(/\(4\+\)/g, "(iv)");
        }

        function startPractice(mode) {
            currentMode = mode;
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            nextQuestion();
        }

        function returnToMenu() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
        }

        function nextQuestion() {
            document.getElementById('feedbackBox').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('inputTrad').value = '';
            document.getElementById('inputIupac').value = '';

            currentItem = db[Math.floor(Math.random() * db.length)];

            document.getElementById('elemBadge').innerText = currentItem.category;

            if (currentMode === 1) {
                document.getElementById('modeBadge').innerText = "Modo: Escribir Nombres";
                document.getElementById('questionLabel').innerText = "ESCRIBE AMBOS NOMBRES";
                
                renderMath(document.getElementById('questionTarget'), currentItem.formula);

                document.getElementById('formMode1').classList.remove('hidden');
                document.getElementById('formMode2').classList.add('hidden');
            } else {
                document.getElementById('modeBadge').innerText = "Modo: Seleccionar Fórmula";
                const useTradName = Math.random() > 0.5;
                const questionName = useTradName ? currentItem.trad[0] : currentItem.iupac[0];
                
                document.getElementById('questionLabel').innerText = useTradName ? "NOM. TRADICIONAL / STOCK" : "NOM. IUPAC / SISTEMA";
                document.getElementById('questionTarget').innerText = questionName.toUpperCase();

                document.getElementById('formMode1').classList.add('hidden');
                document.getElementById('formMode2').classList.remove('hidden');

                const optsContainer = document.getElementById('formMode2');
                optsContainer.innerHTML = '';
                
                const shuffledOpts = [...currentItem.options].sort(() => Math.random() - 0.5);

                shuffledOpts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "p-4 bg-slate-900 hover:bg-slate-700 active:bg-slate-600 rounded-xl border border-slate-700 font-bold text-center text-lg transition flex items-center justify-center min-h-[4.5rem]";
                    btn.onclick = () => checkMode2(opt);
                    renderMath(btn, opt);
                    optsContainer.appendChild(btn);
                });
            }
        }

        function checkMode1() {
            const userTrad = cleanStr(document.getElementById('inputTrad').value);
            const userIupac = cleanStr(document.getElementById('inputIupac').value);

            if (!userTrad || !userIupac) {
                alert("Por favor rellena ambos campos antes de comprobar.");
                return;
            }

            const isTradOk = currentItem.trad.some(t => cleanStr(t) === userTrad);
            const isIupacOk = currentItem.iupac.some(i => cleanStr(i) === userIupac);
            const isCorrect = isTradOk && isIupacOk;
            
            let details = `
                <div class="space-y-1">
                    <p>• Tradicional / Stock: <strong class="text-teal-300">${currentItem.trad[0]}</strong> ${isTradOk ? '✓' : '✗'}</p>
                    <p>• IUPAC / Sistema: <strong class="text-teal-300">${currentItem.iupac[0]}</strong> ${isIupacOk ? '✓' : '✗'}</p>
                </div>
            `;

            showFeedback(isCorrect, details);
        }

        function checkMode2(selectedOpt) {
            const isOk = selectedOpt === currentItem.formula;
            let details = `
                <div class="space-y-1">
                    <p>• Tradicional / Stock: <strong class="text-teal-300">${currentItem.trad[0]}</strong></p>
                    <p>• IUPAC / Sistema: <strong class="text-teal-300">${currentItem.iupac[0]}</strong></p>
                </div>
            `;
            showFeedback(isOk, details);
        }

        function showFeedback(isCorrect, details) {
            total++;
            if (isCorrect) { score++; streak++; } else { streak = 0; }

            document.getElementById('scoreDisplay').innerText = `${score} / ${total}`;
            document.getElementById('streakDisplay').innerText = `🔥 ${streak}`;

            const fb = document.getElementById('feedbackBox');
            fb.classList.remove('hidden', 'bg-emerald-950/90', 'border-emerald-600', 'text-emerald-200', 'bg-rose-950/90', 'border-rose-600', 'text-rose-200');

            if (isCorrect) {
                fb.classList.add('bg-emerald-950/90', 'border', 'border-emerald-600', 'text-emerald-200');
                fb.innerHTML = `<p class="font-bold text-base flex items-center gap-2">¡Excelente! ✨</p>${details}`;
            } else {
                fb.classList.add('bg-rose-950/90', 'border', 'border-rose-600', 'text-rose-200');
                fb.innerHTML = `<p class="font-bold text-base flex items-center gap-2">¡Incorrecto!</p>${details}`;
            }

            document.getElementById('nextBtn').classList.remove('hidden');
        }
    </script>
</body>
</html>
